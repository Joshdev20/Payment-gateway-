<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — PayoutFlow</title>
  <meta name="description" content="PayoutFlow merchant dashboard: payouts, recipients, ledger, checkout and webhooks.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/theme.css?v=4">
  <link rel="stylesheet" href="assets/css/dashboard.css?v=4">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366f1'/%3E%3Cpath d='M11 21V11h6a3.5 3.5 0 010 7h-3' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>

<div class="app">

  <!-- ============ Sidebar ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <a href="index.html" class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="20" height="20"><path d="M11 22V10h6.5a4 4 0 010 8H14" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="brand-name">PayoutFlow</span>
      </a>
    </div>

    <nav class="sidebar-nav" id="sidebarNav" aria-label="Dashboard">
      <button class="nav-item" data-view="overview" aria-current="page">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>
        Overview
      </button>
      <button class="nav-item" data-view="payouts">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        Payouts <span class="count" id="navPayoutCount">—</span>
      </button>
      <button class="nav-item" data-view="recipients">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 20v-2a4 4 0 00-3-3.87"/></svg>
        Recipients <span class="count" id="navRecipientCount">—</span>
      </button>
      <button class="nav-item" data-view="checkout">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20"/></svg>
        Checkout
      </button>

      <div class="nav-label">Finance</div>
      <button class="nav-item" data-view="ledger">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h4"/></svg>
        Ledger
      </button>
      <button class="nav-item" data-view="audit">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><path d="M21 12c0 5-3.5 8-9 9-5.5-1-9-4-9-9V6l9-3 9 3z"/></svg>
        Audit log
      </button>

      <div class="nav-label">Developers</div>
      <button class="nav-item" data-view="webhooks">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a3 3 0 100-6 3 3 0 000 6zM6 16a3 3 0 100-6 3 3 0 000 6zM18 22a3 3 0 100-6 3 3 0 000 6z"/><path d="M8.6 13.5l6.8-4M8.6 10.5l6.8 4"/></svg>
        Webhooks
      </button>
      <button class="nav-item" data-view="api">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 7a5 5 0 11-4.6 3L3 17.4V21h3.6l7.4-7.4"/></svg>
        API keys
      </button>
      <button class="nav-item" data-view="settings">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-2.9 1.2 2 2 0 11-4 0 1.7 1.7 0 00-2.9-1.2l-.1.1a2 2 0 11-2.8-2.8l.1-.1A1.7 1.7 0 003 15a2 2 0 010-4 1.7 1.7 0 001.2-2.9l-.1-.1a2 2 0 112.8-2.8l.1.1A1.7 1.7 0 009 4.6a2 2 0 014 0 1.7 1.7 0 002.9 1.2l.1-.1a2 2 0 112.8 2.8l-.1.1A1.7 1.7 0 0021 11a2 2 0 010 4z"/></svg>
        Settings
      </button>
    </nav>

    <div class="sidebar-foot">
      <div class="biz-card">
        <span class="avatar" id="bizAvatar">NL</span>
        <div class="grow" style="min-width:0">
          <div class="small" style="color:var(--text-1);font-weight:620;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" id="bizName">Northwind Labs</div>
          <div class="tiny muted">Sandbox mode</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <!-- ============ Main ============ -->
  <div class="main">
    <header class="topbar">
      <button class="btn btn-ghost btn-icon mobile-topbar" id="menuBtn" aria-label="Open navigation">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>

      <div class="grow">
        <div class="breadcrumb" id="crumb">Dashboard</div>
        <h1 id="viewTitle">Overview</h1>
      </div>

      <label class="search hide-sm" aria-label="Search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="search" id="globalSearch" placeholder="Search payouts, recipients…">
      </label>

      <span class="badge badge-warn hide-sm" id="modeBadge"><span class="badge-dot"></span>Sandbox</span>

      <button class="btn btn-primary" id="newPayoutBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span class="hide-sm">New payout</span>
      </button>
    </header>

    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>

<script type="module" src="assets/js/dashboard.js?v=4"></script>
</body>
</html>
