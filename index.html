<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payout</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
    background:#f1f5f9;
    background-image:radial-gradient(1100px 520px at 12% -8%,rgba(5,150,105,.12),transparent 60%),
                     radial-gradient(900px 480px at 100% 0%,rgba(37,99,235,.10),transparent 55%);
    background-attachment:fixed;color:#1f2937;-webkit-font-smoothing:antialiased;
  }
  .wrap{width:min(560px,90%);text-align:center;padding:24px 0}
  .logo{
    width:60px;height:60px;border-radius:18px;margin:0 auto 22px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#059669,#047857);
    box-shadow:0 12px 30px -12px rgba(5,150,105,.7);
  }
  .logo svg{width:30px;height:30px;fill:#fff}
  h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0 0 10px;color:#0b1220}
  p.sub{margin:0 0 34px;color:#6b7280;font-size:15px;line-height:1.6}
  .card{
    background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:10px;
    box-shadow:0 1px 2px rgba(16,24,40,.04),0 24px 48px -24px rgba(16,24,40,.18);
    display:flex;flex-direction:column;gap:8px;text-align:left;
  }
  a.row{
    display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:12px;
    text-decoration:none;color:#1f2937;font-weight:600;font-size:15px;
    border:1px solid transparent;transition:background .16s ease,border-color .16s ease,transform .16s ease;
  }
  a.row:hover{background:#f8fafc;border-color:#e5e7eb;transform:translateY(-1px)}
  .ico{
    width:40px;height:40px;flex:0 0 40px;border-radius:11px;display:flex;
    align-items:center;justify-content:center;background:#ecfdf5;color:#059669;font-size:18px;
  }
  .row small{display:block;font-weight:400;color:#9ca3af;font-size:12.5px;margin-top:2px}
  .row span.t{flex:1}
  .chev{color:#d1d5db;font-size:18px}
  footer{margin-top:26px;color:#9ca3af;font-size:12px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M12 1 3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4Zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8Z"/></svg>
    </div>
    <h1>Payout</h1>
    <p class="sub">Choose where you want to go.</p>

    <nav class="card">
      <a class="row" href="pay/index.html">
        <span class="ico">&#128179;</span>
        <span class="t">Checkout<span><small>Card, GCash, PayMaya, bank transfer, wallet</small></span></span>
        <span class="chev">&#8250;</span>
      </a>
      <a class="row" href="pay/upload-ss.html">
        <span class="ico">&#8682;</span>
        <span class="t">Upload receipt<span><small>Send proof of payment</small></span></span>
        <span class="chev">&#8250;</span>
      </a>
      <a class="row" href="admin/index.html">
        <span class="ico">&#9881;</span>
        <span class="t">Admin<span><small>Manage payment details</small></span></span>
        <span class="chev">&#8250;</span>
      </a>
    </nav>

    <footer>Demo interface · no real payments are processed</footer>
  </div>
</body>
</html>
