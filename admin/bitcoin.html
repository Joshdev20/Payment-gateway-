<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        Payout
    </title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="css/gcash.css?v=5">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="container">
        <center>
            <b>
                Edit WALLET
            </b>
        </center>

        <form>
            <div>
                <input class="c-num" id="address" type="text" placeholder="Wallet Address" required>
            </div>

            <div>
                <input class="c-num" id="amount" type="tel" placeholder="Amount" required>
            </div>

            <div>
                <select id="wallet">
                    <option>Select Wallet</option>
                    <option value="BTC">BTC</option>
                    <option value="USDT">USDT</option>
                    <option value="LTC">LTC</option>
                </select>
            </div>

            <div>
                <input class="c-num" id="qrImage" type="file" required>
            </div>

            <div style="color: red; font-size: 13px; margin-left: 10px;">
                Upload your BTC QR Code
            </div>

            <div>
                <button class="pay-btn" id="editBtn">
                    Edit
                </button>
            </div>
        </form>
    </div>

    <script type="module" src="js/bitcoin.js?v=5"></script>
</body>
</html>
