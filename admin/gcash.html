<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        Payout
    </title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="css/gcash.css?v=3">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="container">
        <center>
            <b>
                Edit GCASH
            </b>
        </center>

        <form>
            <div>
                <input class="c-num" id="gcashAcctName" type="text" placeholder="Account Name" required>
            </div>

            <div>
                <input class="c-num" id="gcashAcctNum" type="tel" placeholder="Account Number" required>
            </div>

            <div>
                <input class="c-num" id="gcashCurrency" type="text" placeholder="Currency" required>
            </div>

            <div>
                <input class="c-num" id="gcashAmount" type="tel" placeholder="Amount" required>
            </div>

            <div>
                <button class="pay-btn" id="editBtn">
                    Edit
                </button>
            </div>
        </form>
    </div>

    <script type="module" src="js/gcash.js?v=3"></script>
</body>
</html>
